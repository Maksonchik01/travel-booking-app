# Бекенд на Render (Blueprint): Dashboard → New → Blueprint → цей репозиторій.
# База — Supabase Postgres (ADR 0012): DATABASE_URL задається вручну.
# Фронтенд — на Vercel (apps/web, див. apps/web/vercel.json і docs/deploy.md).
# Секрети (sync: false) Render попросить ввести під час створення; у репозиторії їх немає.
# Довідка полів: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tickets-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free # засинає без запитів; перший запит після сну — до хвилини
    region: frankfurt
    healthCheckPath: /health
    # preDeployCommand на free-плані недоступний: міграції — у CMD образу перед uvicorn.
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_JSON
        value: "true"
      - key: DATABASE_URL # Supabase, Session pooler (docs/deploy.md)
        sync: false
      - key: REDIS_URL
        fromService:
          name: tickets-redis
          type: keyvalue
          property: connectionString
      - key: PUBLIC_WEB_URL # https://<проєкт>.vercel.app
        sync: false
      - key: INTERNAL_API_KEY # той самий, що у Vercel: IP відвідувача для лімітів
        sync: false
      - key: CORS_ORIGINS # та сама адреса Vercel
        sync: false
      - key: FLIGHT_PROVIDERS # живі ціни (SerpApi, scrape.do) + продавці з кешу Aviasales (ADR 0041, 0043)
        value: serpapi,scrapedo,travelpayouts
      - key: CALENDAR_PROVIDERS
        value: travelpayouts
      - key: STAY_PROVIDERS
        value: mock
      - key: ALERT_PROVIDERS
        value: travelpayouts
      - key: LLM_PROVIDER
        value: deepseek
      - key: TELEGRAM_BOT_USERNAME
        value: flyandbookbot
      - key: SERPAPI_KEY
        sync: false
      - key: SCRAPEDO_TOKEN
        sync: false
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # Перевірка алертів і опитування Telegram-бота. Фонові воркери на Render безкоштовними
  # не бувають; без воркера сайт працює, але бот мовчить і підписки не перевіряються.
  - type: worker
    name: tickets-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    region: frankfurt
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_JSON
        value: "true"
      - key: DATABASE_URL # Supabase, Session pooler (docs/deploy.md)
        sync: false
      - key: REDIS_URL
        fromService:
          name: tickets-redis
          type: keyvalue
          property: connectionString
      - key: PUBLIC_WEB_URL
        sync: false
      - key: ALERT_PROVIDERS
        value: travelpayouts
      - key: TELEGRAM_BOT_USERNAME
        value: flyandbookbot
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

  - type: keyvalue
    name: tickets-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction # черга ARQ не повинна витіснятися кешем
    ipAllowList: [] # лише внутрішня мережа Render
