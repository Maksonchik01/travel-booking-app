[project]
name = "tickets-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tickets-api",
  "arq>=0.26",
]

[tool.uv.sources]
tickets-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tickets_worker"]
