# Зручність часу перельотів у поїздці (модуль 8a, ADR 0021): «ціна» незручності в EUR на кожного
# пасажира з місцем. Додається до оцінки «Оптимального» сценарію, не до суми, яку платите.
# Час — місцевий час аеропорту з рядка провайдера. Поїздки в іншій валюті не оцінюються
# (як і житло, ADR 0008) — лише показуються.

currency = "EUR"

[timing]
night_arrival_before = 6   # приліт 00:00–05:59: заселення зазвичай з 14:00, ніч перед прильотом не оплачена
night_arrival = 30
late_arrival_from = 23     # приліт з 23:00 — пізнє заселення (варто попередити житло)
late_arrival = 10
early_return_before = 7    # виліт назад до 07:00 — виїзд з житла вночі
early_return = 20
late_return_from = 19      # виліт назад з 19:00 — після виселення (~11:00) день з речами
late_return = 10
