[project]
name = "tickets-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "structlog>=24.4",
  "sentry-sdk[fastapi]>=2.13",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tickets_api"]
